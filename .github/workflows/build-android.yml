name: Build Android TWA

# Fixed invalid YAML (was truncated "on: workf").
# Manual / version tags only — same TWA skeleton as android-ci.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .github/workflows/android-twa/Holly2_TWA_Skeleton

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install & build web (optional host for TWA)
        working-directory: .
        run: |
          npm ci
          npm -w @holly/web run build

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Android TWA (Debug)
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Holly_2.0_TWA_debug
          path: .github/workflows/android-twa/Holly2_TWA_Skeleton/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Create Release for Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: .github/workflows/android-twa/Holly2_TWA_Skeleton/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
