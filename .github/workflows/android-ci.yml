name: Android CI (TWA skeleton)

# Full Android product app is not the main monorepo path yet.
# Builds the checked-in TWA skeleton under .github/workflows/android-twa/
# Manual + tags only — does not fail every main push for missing root gradlew.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/android-twa/**"
      - ".github/workflows/android-ci.yml"

permissions:
  contents: read

jobs:
  build_apk:
    name: Build TWA Debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .github/workflows/android-twa/Holly2_TWA_Skeleton

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Assemble Debug
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-twa-debug-apk
          path: .github/workflows/android-twa/Holly2_TWA_Skeleton/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
