name: Build and Upload APK

# Prebuilt APK in repo is gitignored (*.apk). Only run manually when you
# place an APK at repo root for packaging.
on:
  workflow_dispatch:

jobs:
  upload-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List APK files
        run: |
          echo "APK soubory ve složce:"
          ls -lh *.apk 2>/dev/null || echo "Žádné APK (*.apk je v .gitignore)."

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Holly_2.0_Pro_APK
          path: Holly_2.0_Pro.apk
          if-no-files-found: warn
